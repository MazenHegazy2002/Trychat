appId: com.trychat.app
name: New project
---
- launchApp
- extendedWaitUntil: { visible: "Search chats", timeout: 60000 }
- runFlow: { file: ../subflows/go.yaml, env: { ROUTE: "projects/new" } }
- extendedWaitUntil: { visible: "New project", timeout: 15000 }
- takeScreenshot: projects_new
- tapOn: "e.g. Spanish"
- inputText: "Maestro project"
- tapOn: { text: "Name", index: 0 }   # a label, not an input: dismisses the keyboard (no hideKeyboard, see 03_chat)
- tapOn: "Create"                      # the header button, above the keyboard either way
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: projects_created
- runFlow: { file: ../subflows/go.yaml, env: { ROUTE: "projects" } }
- assertVisible: "Maestro project"
- takeScreenshot: projects_list
