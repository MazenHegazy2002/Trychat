appId: com.trychat.app
name: Account
---
- launchApp
- extendedWaitUntil: { visible: "Search chats", timeout: 60000 }
- runFlow: { file: ../subflows/go.yaml, env: { ROUTE: "account" } }
- extendedWaitUntil: { visible: "Account|Sign in|Create account", timeout: 15000 }   # signed out: the sign-in form, no title
- takeScreenshot: account
