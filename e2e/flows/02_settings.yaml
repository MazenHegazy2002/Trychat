appId: com.trychat.app
name: Settings and every row
---
- launchApp
- extendedWaitUntil: { visible: "Search chats", timeout: 60000 }
- tapOn: { text: "Settings", index: 0 }
- extendedWaitUntil: { visible: "Connections", timeout: 15000 }
- takeScreenshot: 02_settings
- tapOn: { point: "50%,15%" }   # account card at the top of Settings
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: 02_row_account
- runFlow: { file: ../subflows/go.yaml, env: { ROUTE: "settings" } }
- scrollUntilVisible: { element: { text: "GitHub & laptop" }, direction: DOWN, timeout: 15000 }
- tapOn: { text: "GitHub & laptop", index: 0 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: 02_row_connections
- runFlow: { file: ../subflows/go.yaml, env: { ROUTE: "settings" } }
- scrollUntilVisible: { element: { text: "Skills" }, direction: DOWN, timeout: 15000 }
